name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Format, Lint & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (oxfmt)
        run: pnpm format:check

      - name: Lint (oxlint)
        run: pnpm lint

      - name: Analyze (fallow)
        run: pnpm analyze

      # Report-only: `pnpm analyze` above is the gate, so a non-zero exit here
      # (findings above threshold) must not fail the job a second time.
      - name: Health report (fallow)
        if: always()
        run: |
          pnpm exec fallow health --format github-summary >> "$GITHUB_STEP_SUMMARY" || true
          pnpm exec fallow health --format json --output-file fallow-health.json || true

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fallow-health
          path: fallow-health.json

      - name: Test (vitest)
        run: pnpm test
